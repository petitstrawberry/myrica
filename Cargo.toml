[package]
name = "myrica"
version = "0.1.0"
edition = "2024"
description = "A cross-platform web browser built for Scarlet OS"
license = "MIT"

[[bin]]
name = "myrica"
path = "src/main.rs"

[features]
default = ["backend-blitz"]
javascript = ["backend-blitz", "dep:blitz-vibey-script", "dep:getrandom-v04"]
backend-blitz = [
    "dep:anyrender",
    "dep:anyrender_vello_cpu",
    "dep:blitz-dom",
    "dep:blitz-html",
    "dep:blitz-paint",
    "dep:blitz-traits",
    "dep:data-url",
    "dep:image",
    "dep:keyboard-types",
    "dep:parley",
    "dep:peniko",
    "dep:reqwest",
    "dep:tokio",
]

[dependencies]
anyrender = { version = "0.13.0", optional = true }
anyrender_vello_cpu = { version = "0.17.0", optional = true }
blitz-html = { git = "https://github.com/petitstrawberry/blitz", rev = "b394a18b0a07d2c230f4de95c7aa20cd78cc2013", optional = true }
blitz-vibey-script = { git = "https://github.com/petitstrawberry/blitz", rev = "b394a18b0a07d2c230f4de95c7aa20cd78cc2013", optional = true }
blitz-paint = { git = "https://github.com/petitstrawberry/blitz", rev = "b394a18b0a07d2c230f4de95c7aa20cd78cc2013", default-features = false, features = ["scrollbars"], optional = true }
blitz-traits = { git = "https://github.com/petitstrawberry/blitz", rev = "b394a18b0a07d2c230f4de95c7aa20cd78cc2013", default-features = false, optional = true }
data-url = { version = "0.3.1", optional = true }
image = { version = "0.25.6", default-features = false, features = ["gif", "ico", "jpeg", "webp"], optional = true }
keyboard-types = { version = "0.7", optional = true }
parley = { git = "https://github.com/linebender/parley", rev = "dbcdc7d214f28fb7ec16bb17b34bf0aeb85d0fc7", default-features = false, features = ["std"], optional = true }
peniko = { version = "0.6.0", optional = true }
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "rustls-tls-webpki-roots"], optional = true }
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time"], optional = true }

[target.'cfg(target_os = "scarlet")'.dependencies]
blitz-dom = { git = "https://github.com/petitstrawberry/blitz", rev = "b394a18b0a07d2c230f4de95c7aa20cd78cc2013", default-features = false, features = ["woff"], optional = true }
getrandom = { version = "0.2.16", default-features = false, features = ["custom"] }
getrandom-v04 = { package = "getrandom", version = "0.4.3", optional = true }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b3d2a55740a3d2ca49daad0ec7baba233f706f7a", package = "scarlet-os", default-features = false, features = ["std"] }
scarlet-sys = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b3d2a55740a3d2ca49daad0ec7baba233f706f7a", package = "scarlet-sys" }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "e6e00f11c95de371057899ec05b7a832d04adc7f", package = "scarlet-ui", default-features = false, features = ["std", "platform-sws"] }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
blitz-dom = { git = "https://github.com/petitstrawberry/blitz", rev = "b394a18b0a07d2c230f4de95c7aa20cd78cc2013", default-features = false, features = ["system-fonts", "woff"], optional = true }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "e6e00f11c95de371057899ec05b7a832d04adc7f", package = "scarlet-ui", default-features = false, features = ["std", "platform-winit"] }

[patch.crates-io]
ring = { git = "https://github.com/petitstrawberry/ring.git", branch = "scarlet" }
selectors = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
servo_arc = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
socket2 = { git = "https://github.com/petitstrawberry/socket2.git", rev = "15f0140af367c76befdab2606c7b643f29552bfd" }
stylo = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
stylo_atoms = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
stylo_derive = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
stylo_dom = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
stylo_malloc_size_of = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
stylo_static_prefs = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
stylo_traits = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
to_shmem = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
to_shmem_derive = { git = "https://github.com/petitstrawberry/stylo", branch = "scarlet" }
tokio = { git = "https://github.com/petitstrawberry/tokio.git", rev = "8610548b5826d9405a2c7bff6465aee01813be83" }

[profile.dev]
opt-level = 2
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }
