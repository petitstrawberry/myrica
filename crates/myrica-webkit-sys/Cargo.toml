[package]
name = "myrica-webkit-sys"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bindings to WebKit's Scarlet embedding API"
links = "scarlet_webview"
build = "build.rs"

[features]
vulkan-probe = []
vulkan-rendering = []
media = ["dep:scarlet-codecs", "dep:sas-client"]

[dependencies]
scarlet-codecs = { git = "https://github.com/petitstrawberry/Scarlet", rev = "ed2c077efe8caa8f62882a613d0941fe1a5db71b", optional = true, default-features = false, features = ["software-media"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "d3b1c05127d4df3616f988b81a99f616e8a88064", default-features = false, features = ["std"] }
sas-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "ed2c077efe8caa8f62882a613d0941fe1a5db71b", optional = true, default-features = false, features = ["std"] }
