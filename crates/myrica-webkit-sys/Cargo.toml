[package]
name = "myrica-webkit-sys"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bindings to WebKit's Scarlet embedding API"
links = "scarlet_webview"
build = "build.rs"

[features]
vulkan-probe = []
vulkan-rendering = []
media = ["dep:scarlet-codecs", "dep:sas-client", "dep:scarlet-video-client"]
encrypted-media = ["dep:cdm-host"]

[dependencies]
scarlet-codecs = { git = "https://github.com/petitstrawberry/Scarlet", rev = "7ea687d9139bf64d8676bad41257ba897d623bce", optional = true, default-features = false, features = ["media-container-aac"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }

[target.'cfg(target_os = "scarlet")'.dependencies]
cdm-host = { path = "../cdm-host", optional = true }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "d3b1c05127d4df3616f988b81a99f616e8a88064", default-features = false, features = ["std"] }
sas-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "7ea687d9139bf64d8676bad41257ba897d623bce", optional = true, default-features = false, features = ["std"] }
scarlet-video-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "7ea687d9139bf64d8676bad41257ba897d623bce", optional = true, default-features = false, features = ["std", "h264-stateful-hw", "h264-stateless-hw"] }
