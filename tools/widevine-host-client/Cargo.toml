[package]
name = "widevine-host-client"
version = "0.1.0"
edition = "2024"
description = "Scarlet-native client for the widevine-host CDM service process"
license = "MIT"

[[bin]]
name = "widevine-host-client"
path = "src/main.rs"

[dependencies]
scarlet-sys = { git = "https://github.com/petitstrawberry/Scarlet", rev = "d3b1c05127d4df3616f988b81a99f616e8a88064" }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "d3b1c05127d4df3616f988b81a99f616e8a88064", default-features = false, features = ["std"] }

[profile.release]
panic = "abort"
